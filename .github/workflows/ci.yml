name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # "build" runs tests, the JaCoCo report and the coverage check.
      - name: Build and test
        run: bash ./gradlew clean build

      # The report is a convenience: an upload problem (e.g. storage quota)
      # must not fail the build. The coverage gate itself runs in "build".
      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t devices-api:ci .
