spring:
  application:
    name: devices-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devices_db}
    username: ${DB_USERNAME:devices_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration