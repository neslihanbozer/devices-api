spring:
  application:
    name: devices-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devices_db}
    username: ${DB_USERNAME:devices_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# HTTP Basic users. Passwords have no default: the application refuses to
# start without them. start.ps1 / start.sh generate them into .env.
devices:
  security:
    admin:
      username: ${API_ADMIN_USERNAME:admin}
      password: ${API_ADMIN_PASSWORD}
    viewer:
      username: ${API_VIEWER_USERNAME:viewer}
      password: ${API_VIEWER_PASSWORD}
