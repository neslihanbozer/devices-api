services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: devices_db
      POSTGRES_USER: devices_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devices_user -d devices_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: